plugins {
    id 'java-library'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'com.bocktom'
version = project.plugin_version + "+" + project.paper_version
description = 'VoiceChatPlaceholders'

repositories {
    mavenLocal()
    maven {
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = "https://maven.maxhenkel.de/repository/public"
    }
    maven {
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        url = "https://repo.maven.apache.org/maven2/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paper_version}.build.+")
    compileOnly("de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}")
    compileOnly("me.clip:placeholderapi:${placeholderapi_version}")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion(paper_version)

        downloadPlugins {
            modrinth("placeholderapi", placeholderapi_version)
            modrinth("simple-voice-chat", "bukkit-${voicechat_api_version}")
        }
    }
}

java.sourceCompatibility = JavaVersion.VERSION_21
def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.guava:guava:33.3.1-jre'
        force 'com.google.code.gson:gson:2.11.0'
        force 'it.unimi.dsi:fastutil:8.5.15'
    }
}